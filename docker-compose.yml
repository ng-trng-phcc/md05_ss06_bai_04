name: rikkei-ss06-banking01

services:
  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - banking-network

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: account-service:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://core-db:5432/banking_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - banking-network

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    image: transaction-service:latest
    ports:
      - "8081:8081"
    environment:
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8080
      SERVER_PORT: 8081
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - banking-network

volumes:
  pg-data:
    external: true
    name: rikkei-ss06-banking01_banking-db-data

networks:
  banking-network:
    name: banking-network
    driver: bridge
